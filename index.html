<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פרימיום תעשיידע</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: #7de8ff;
      --glow-strong: #8a7dff;
      --text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.35);
      --btn-bg: rgba(12, 29, 58, 0.72);
      --btn-border: rgba(255, 255, 255, 0.2);
      --btn-highlight: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Heebo', sans-serif;
    }

    body {
      min-height: 100vh;
      background-image:
        linear-gradient(to bottom, rgba(4, 10, 24, 0.35), rgba(4, 10, 24, 0.55)),
        url('images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 36px 20px 60px;
    }

    .page-title {
      font-family: 'Assistant', 'Heebo', sans-serif;
      margin: 10px 0 22px;
      text-align: center;
      font-size: clamp(2.8rem, 5.6vw, 5.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-shadow:
        0 4px 10px rgba(0, 0, 0, 0.45),
        0 0 10px rgba(125, 232, 255, 0.7),
        0 0 22px rgba(138, 125, 255, 0.45);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
    }

    .center-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-grid {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 140px);
      justify-content: center;
      gap: 18px;
      padding: 20px;
    }

    .magic-btn {
      position: relative;
      width: 140px;
      height: 140px;
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03)),
        var(--btn-bg);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -8px 14px rgba(0, 0, 0, 0.18),
        0 10px 18px rgba(0, 0, 0, 0.28),
        0 0 16px rgba(125, 232, 255, 0.12);
      transition:
        transform 0.16s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
      overflow: hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .magic-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 42%, transparent 58%, rgba(125,232,255,0.08));
      pointer-events: none;
    }

    .magic-btn::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .magic-btn:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(125, 232, 255, 0.6);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 -10px 16px rgba(0, 0, 0, 0.16),
        0 18px 26px rgba(0, 0, 0, 0.34),
        0 0 22px rgba(125, 232, 255, 0.24);
    }

    .magic-btn:active {
      transform: translateY(3px) scale(0.99);
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.28),
        inset 0 -2px 5px rgba(255, 255, 255, 0.06),
        0 5px 10px rgba(0, 0, 0, 0.22);
    }

    .magic-btn span {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 860px) {
      .button-grid {
        grid-template-columns: repeat(2, 130px);
      }

      .magic-btn {
        width: 130px;
        height: 130px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding-top: 26px;
      }

      .page-title {
        margin-bottom: 24px;
      }

      .button-grid {
        grid-template-columns: repeat(2, 110px);
        justify-content: center;
        gap: 12px;
        padding: 10px;
      }

      .magic-btn {
        width: 110px;
        height: 110px;
        font-size: 0.95rem;
      }
    }
  
    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .brand-logo {
      width: min(150px, 28vw);
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.3)) drop-shadow(0 0 12px rgba(125, 232, 255, 0.22));
    }

    @media (max-width: 560px) {
      .brand-logo {
        width: min(110px, 32vw);
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="hero-brand">
    <img class="brand-logo" src="images/logo.png" alt="" />
    <h1 class="page-title">תעשיידע | פרימיום</h1>
  </div>

  <div class="center-wrap">
    <div class="button-grid">
      <button class="magic-btn" onclick="window.location.href='news/allnews.html'"><span>News</span></button>
      <button class="magic-btn"><span>כפתור 2</span></button>
      <button class="magic-btn"><span>כפתור 3</span></button>
      <button class="magic-btn"><span>כפתור 4</span></button>
      <button class="magic-btn"><span>כפתור 5</span></button>
      <button class="magic-btn"><span>כפתור 6</span></button>
    </div>
  </div>
</body>
</html>
