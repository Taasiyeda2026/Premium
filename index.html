<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Premium" />
  <meta name="application-name" content="Premium" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png" />
  <link rel="stylesheet" href="styles/pwa.css" />
  <title>פרימיום תעשיידע</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #ffffff;
      --btn-bg: rgba(22, 36, 62, 0.72);
      --neon: rgba(125, 232, 255, 0.9);
      --neon-soft: rgba(125, 232, 255, 0.35);
      --btn-border: rgba(125, 232, 255, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Heebo', sans-serif;
    }

    body {
      min-height: 100vh;
      background-image:
        linear-gradient(to bottom, rgba(4, 10, 24, 0.30), rgba(4, 10, 24, 0.52)),
        url('bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 36px 20px 60px;
    }

    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .brand-logo {
      width: min(112px, 22vw);
      height: auto;
      margin-bottom: 10px;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.3))
        drop-shadow(0 0 10px rgba(125, 232, 255, 0.18));
    }

    .page-title {
      font-family: 'Assistant', 'Heebo', sans-serif;
      margin: 10px 0 22px;
      text-align: center;
      font-size: clamp(2rem, 4.2vw, 3.9rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-shadow:
        0 4px 10px rgba(0, 0, 0, 0.45),
        0 0 8px rgba(125, 232, 255, 0.45);
    }

    .center-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-grid {
      width: min(460px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 190px));
      justify-content: center;
      gap: 22px;
      padding: 16px;
    }

    .magic-btn {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--btn-border);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03)),
        linear-gradient(135deg, rgba(36, 58, 92, 0.18), rgba(14, 22, 38, 0.10)),
        var(--btn-bg);
      color: #fff;
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition:
        transform 0.16s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -8px 14px rgba(0, 0, 0, 0.14),
        0 0 5px rgba(125, 232, 255, 0.40),
        0 0 10px rgba(125, 232, 255, 0.22),
        0 10px 18px rgba(0, 0, 0, 0.26);
    }

    .magic-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.16),
        transparent 45%,
        transparent 60%,
        rgba(125, 232, 255, 0.08)
      );
      pointer-events: none;
    }

    .magic-btn::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 12px;
      border: 1px solid rgba(125, 232, 255, 0.18);
      pointer-events: none;
    }

    .magic-btn:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(125, 232, 255, 1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -10px 16px rgba(0, 0, 0, 0.14),
        0 0 8px rgba(125, 232, 255, 0.58),
        0 0 18px rgba(125, 232, 255, 0.34),
        0 18px 26px rgba(0, 0, 0, 0.30);
    }

    .magic-btn:active {
      transform: translateY(2px) scale(0.99);
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.24),
        0 0 5px rgba(125, 232, 255, 0.28),
        0 5px 10px rgba(0, 0, 0, 0.20);
    }

    .magic-btn span {
      position: relative;
      z-index: 1;
      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.32),
        0 0 8px rgba(125, 232, 255, 0.22);
    }

    @media (max-width: 560px) {
      body {
        padding: 20px 16px 40px;
      }

      .brand-logo {
        width: min(80px, 22vw);
        margin-bottom: 6px;
      }

      .page-title {
        font-size: clamp(1.6rem, 7vw, 2.4rem);
        margin-bottom: 20px;
      }

      .button-grid {
        grid-template-columns: 1fr;
        width: 100%;
        max-width: 260px;
        gap: 14px;
        padding: 8px 0;
      }

      .magic-btn {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="hero-brand">
    <img class="brand-logo" src="images/logo.png" alt="" />
    <h1 class="page-title">תעשיידע | פרימיום</h1>
  </div>

  <div class="center-wrap">
    <div class="button-grid">
      <button class="magic-btn" onclick="window.location.href='index_osem.html'">
        <span>אסם</span>
      </button>

      <button class="magic-btn" onclick="window.location.href='index_marvell.html'">
        <span>מארוול</span>
      </button>
    </div>
  </div>

  <script src="pwa-register.js" defer></script>
</body>
</html>
