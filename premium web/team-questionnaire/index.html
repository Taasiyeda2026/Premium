<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2747" />
  <title>שאלון פתיחה | פרימיום תעשיידע</title>
  <style>
    :root {
      --bg-1: #f7fbff;
      --bg-2: #eef6ff;
      --card: rgba(255,255,255,.94);
      --text: #10233e;
      --muted: #607189;
      --line: #dbe7f4;
      --primary: #1867c9;
      --primary-dark: #0d4f9d;
      --accent: #12a7a1;
      --warm: #f0a23b;
      --shadow: 0 16px 42px rgba(28, 62, 104, .12);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg-2); }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Heebo", "Arial", sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(24,103,201,.13), transparent 34%),
        radial-gradient(circle at 0% 95%, rgba(18,167,161,.10), transparent 30%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 760px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: #183555;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      background: url('../images/logo.png') center / contain no-repeat;
      font-size: 0;
      color: transparent;
    }

    .progress-wrap { flex: 1; max-width: 240px; display: none; }
    .progress-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .progress-track { height: 8px; border-radius: 999px; background: #dce8f5; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .25s ease; }

    .screen { flex: 1; display: none; align-items: center; justify-content: center; padding: 10px 0 18px; }
    .screen.active { display: flex; }

    .card {
      width: 100%;
      border: 1px solid rgba(201,218,236,.86);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 24px 18px;
      backdrop-filter: blur(10px);
    }

    .hero { text-align: center; padding: 28px 20px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #edf6ff;
      color: #17589e;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 14px;
    }

    h1, h2, p { margin-top: 0; }
    h1 { font-size: clamp(30px, 8vw, 48px); line-height: 1.08; margin-bottom: 12px; letter-spacing: -.02em; }
    h2 { font-size: clamp(24px, 6.6vw, 36px); line-height: 1.18; margin-bottom: 10px; letter-spacing: -.015em; }
    .lead { color: var(--muted); font-size: 17px; line-height: 1.55; margin-bottom: 22px; }

    .form-grid {
      width: min(100%, 330px);
      display: grid;
      gap: 12px;
      margin: 20px auto 0;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #cddced;
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input { min-height: 52px; padding: 0 15px; text-align: right; }
    textarea { min-height: 92px; padding: 13px 15px; resize: vertical; line-height: 1.45; }
    input:focus, textarea:focus { border-color: #5a9ce8; box-shadow: 0 0 0 4px rgba(24,103,201,.10); }
    input::placeholder, textarea::placeholder { color: #7a8ba0; opacity: 1; }

    .class-code-status {
      width: min(100%, 330px);
      margin: 8px auto 0;
      color: #b24a3e;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }
    .class-code-status:empty { display: none; }

    .primary-btn, .secondary-btn {
      width: 100%;
      min-height: 56px;
      border-radius: 17px;
      border: 0;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), #2383d8 55%, var(--accent));
      color: #fff;
      box-shadow: 0 11px 24px rgba(24,103,201,.23);
      margin-top: 18px;
    }

    #startBtn {
      width: auto;
      min-width: 150px;
      min-height: 46px;
      padding: 0 26px;
      margin: 18px auto 0;
      display: block;
      border-radius: 14px;
    }

    .primary-btn:active, .secondary-btn:active { transform: scale(.985); }
    .primary-btn:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }

    .question-card { padding: 21px 16px 17px; }
    .question-kicker { color: var(--primary); font-weight: 900; font-size: 13px; margin-bottom: 8px; }
    .question-title { font-size: clamp(23px, 6vw, 32px); line-height: 1.25; margin-bottom: 18px; }
    .answers { display: grid; gap: 11px; }

    .answer-btn {
      width: 100%;
      min-height: 66px;
      border: 1px solid #d2e0ee;
      border-radius: 18px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      padding: 13px 15px;
      text-align: right;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.35;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(38,72,110,.05);
      transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
    }

    .answer-btn:hover { border-color: #9fc1e7; }
    .answer-btn:active { transform: scale(.988); }
    .answer-btn.selected { border-color: #287bd2; background: #eff7ff; box-shadow: 0 0 0 3px rgba(24,103,201,.08); }

    .answer-dot {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 1px solid #c6d8e9;
      display: grid;
      place-items: center;
      color: transparent;
      background: #f9fcff;
      font-size: 15px;
      font-weight: 900;
    }

    .answer-btn.selected .answer-dot { color: #fff; border-color: transparent; background: linear-gradient(145deg, var(--primary), var(--accent)); }

    .question-actions { margin-top: 15px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }

    .secondary-btn {
      min-width: 92px;
      width: auto;
      padding: 0 17px;
      border: 1px solid #d1dfed;
      background: #fff;
      color: #35536f;
      box-shadow: none;
    }

    .question-actions .primary-btn { margin: 0; }
    .fun-card { padding: 24px 18px; }
    .fun-intro { color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
    .fun-grid { display: grid; gap: 14px; }
    .fun-field { display: grid; gap: 7px; }
    .fun-label { color: #234a70; font-weight: 800; font-size: 15px; line-height: 1.4; }

    .submit-status { min-height: 22px; margin-top: 10px; color: #b24a3e; font-size: 14px; font-weight: 700; text-align: center; }

    .finish-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: linear-gradient(145deg, #e8f5ff, #eafbf8);
      border: 1px solid #cfe6ef;
    }

    .debug { display: none; margin-top: 14px; direction: ltr; text-align: left; font: 12px/1.4 monospace; white-space: pre-wrap; color: #445; background: #f7f7f8; border-radius: 12px; padding: 10px; }

    @media (min-width: 680px) {
      .app { padding-inline: 24px; }
      .card { padding: 34px 32px; }
      .question-card, .fun-card { padding: 30px; }
      .answers { grid-template-columns: 1fr 1fr; }
      .answer-btn { min-height: 82px; }
      .progress-wrap { display: block; }
    }

    @media (max-width: 679px) {
      .app { padding-inline: 12px; }
      .topbar { position: sticky; top: 0; z-index: 5; padding: 5px 2px 8px; background: linear-gradient(180deg, rgba(247,251,255,.96), rgba(247,251,255,.78), transparent); }
      .brand-label { font-size: 14px; }
      .brand-mark { width: 40px; height: 40px; flex-basis: 40px; }
      .screen { align-items: flex-start; padding-top: 2px; }
      .card { border-radius: 21px; }
      .question-card { min-height: calc(100dvh - 98px); display: flex; flex-direction: column; }
      .answers { flex: 1; align-content: start; }
      .question-actions { position: sticky; bottom: max(6px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.96) 22%); padding-top: 18px; }
      .form-grid { width: min(84%, 330px); }
      .class-code-status { width: min(84%, 330px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    :focus-visible { outline: 3px solid rgba(24,103,201,.35); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-label="לוגו תעשיידע" onclick="this._ic=(this._ic||0)+1;clearTimeout(this._it);if(this._ic>=4){location.href='instructor.html'}else{this._it=setTimeout(()=>{this._ic=0},2500)}"></div>
        <div class="brand-label">תעשיידע | פרימיום</div>
      </div>
      <div class="progress-wrap" id="progressWrap" aria-hidden="true">
        <div class="progress-label" id="progressLabel">שאלה 1</div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </header>

    <section class="screen active" id="startScreen">
      <div class="card hero">
        <div class="eyebrow">⚡ 12–14 שאלות קצרות</div>
        <h1>איך אתם פועלים ביום-יום?</h1>
        <p class="lead">בכל מצב בחרו את התגובה שהכי דומה למה שהייתם עושים באמת. אין תשובה נכונה או לא נכונה — פשוט בוחרים וממשיכים.</p>

        <div class="form-grid">
          <input id="studentName" type="text" autocomplete="off" data-form-type="other" maxlength="60" placeholder="שם פרטי ומשפחה" aria-label="שם פרטי ומשפחה" />
          <input id="classCode" type="text" inputmode="numeric" autocomplete="off" data-form-type="other" maxlength="6" placeholder="קוד כיתה" aria-label="קוד כיתה" />
        </div>
        <div class="class-code-status" id="classCodeStatus" role="status" aria-live="polite"></div>

        <button class="primary-btn" id="startBtn" disabled>מתחילים</button>
      </div>
    </section>

    <section class="screen" id="questionScreen">
      <div class="card question-card">
        <div class="question-kicker" id="questionKicker">מצב 1</div>
        <h2 class="question-title" id="questionTitle"></h2>
        <div class="answers" id="answers"></div>
        <div class="question-actions">
          <button class="primary-btn" id="nextBtn" disabled>המשך</button>
          <button class="secondary-btn" id="backBtn" type="button">חזרה</button>
        </div>
        <div class="submit-status" id="submitStatus" role="status" aria-live="polite"></div>
      </div>
    </section>


    <section class="screen" id="finishScreen">
      <div class="card hero">
        <div class="finish-icon" aria-hidden="true">✓</div>
        <h1>התשובות התקבלו.</h1>
        <div class="debug" id="debugBox"></div>
      </div>
    </section>
  </main>

  <script src="v3-engine.js"></script>
</body>
</html>
