    textarea { min-height:72px; }
    .check-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; }
    .check-grid label { background:#ecf5ff; border:1px solid #c4ddf2; border-radius:10px; padding:8px; font-size:.9rem; }

<body>
  <div class="mv-container">
    <header class="mv-header">
