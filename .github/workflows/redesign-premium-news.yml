name: Redesign Premium news page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Premium visual language
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          page = Path('premium web/news/allnews.html')
          text = page.read_text(encoding='utf-8')
          text = text.replace('<meta name="theme-color" content="#0f172a" />', '<meta name="theme-color" content="#f4f8fb" />')
          text = text.replace('<title>עמוד כתבות ראשי</title>', '<title>פרימיום | מרחב הכתבות</title>')
          text = text.replace('<div class="logo">חדשות היום</div>', '<div class="logo">פרימיום | מרחב הכתבות</div>')
          text = text.replace('<h1>ברוכים הבאים לעמוד הכתבות</h1>', '<h1>עמוד הכתבות</h1>')
          text = text.replace('לפניכם כתבות קצרות מחיי היומיום של תלמידים, משפחות וסביבה לימודית. בחרו כתבה, קראו את המקרה, וזהו מתוכה בעיה אמיתית שאפשר להפוך לאתגר יזמי.', 'בחרו כתבה, קראו את המקרה, וזהו מתוכה בעיה או צורך אמיתי שאפשר להפוך להזדמנות לחשיבה יזמית.')
          marker = '/* PREMIUM 2026 LIGHT INNOVATION OVERRIDES */'
          encoded_css = ''
          if marker not in text:
              css = base64.b64decode(encoded_css).decode('utf-8')
              text = text.replace('</style>', css + '\n  </style>', 1)
          page.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, count = re.subn(r"const CACHE_NAME = 'premium-static-v\d+';", "const CACHE_NAME = 'premium-static-v13';", sw_text, count=1)
          if count != 1:
              raise SystemExit('Could not update cache version')
          sw.write_text(sw_text, encoding='utf-8')

          updated = page.read_text(encoding='utf-8')
          for item in ['פרימיום | מרחב הכתבות', 'עמוד הכתבות', marker, '#14b8a6', '#38bdf8']:
              if item not in updated:
                  raise SystemExit(f'Missing expected redesign marker: {item}')
          PY

      - name: Verify scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -vE '^(premium web/news/allnews.html|service-worker.js)$' | grep -q .; then
            echo 'Unexpected file changed'
            exit 1
          fi
          if git diff --name-only | grep -qE '^(marvell_web/|osem web/)'; then
            echo 'Other brands must remain untouched'
            exit 1
          fi

      - name: Commit redesign and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/redesign-premium-news.yml
          git add -A
          git commit -m 'Refresh Premium news visual language'
          git push origin HEAD:main
