name: Fix Premium broken references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conservative Premium-only fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]

          # Premium news pages live two levels below repository root.
          for p in sorted(Path('premium web/news').glob('*.html')):
              s=p.read_text(encoding='utf-8'); old=s
              s=s.replace('href="../manifest.json"','href="../../manifest.json"')
              s=s.replace("href='../manifest.json'","href='../../manifest.json'")
              s=s.replace('href="../styles/pwa.css"','href="../../styles/pwa.css"')
              s=s.replace("href='../styles/pwa.css'","href='../../styles/pwa.css'")
              s=s.replace('src="../pwa-register.js"','src="../../pwa-register.js"')
              s=s.replace("src='../pwa-register.js'","src='../../pwa-register.js'")
              if s!=old:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # Pitch page logo references should use the shared repository logo.
          p=Path('premium web/pitchpremium.html')
          s=p.read_text(encoding='utf-8'); old=s
          s=re.sub(r'(?P<q>["\'])logo\.png(?P=q)', lambda m: m.group('q')+'../images/logo.png'+m.group('q'), s)
          if s!=old:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # Remove two dead legacy dependencies from the Premium prototype page.
          p=Path('premium web/allprd.html')
          s=p.read_text(encoding='utf-8'); old=s
          s=re.sub(r'\s*<script\s+src=["\']/_sdk/element_sdk\.js["\']\s*></script>\s*', '\n', s, flags=re.I)
          s=re.sub(r'\s*<link\s+rel=["\']stylesheet["\']\s+href=["\']\.\./css/print\.css["\']\s+media=["\']print["\']\s*/?>\s*', '\n', s, flags=re.I)
          if s!=old:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # Bump cache because several cached Premium pages changed.
          swp=Path('service-worker.js')
          sw=swp.read_text(encoding='utf-8')
          m=re.search(r"const CACHE_NAME = 'premium-static-v(\d+)';",sw)
          if not m: raise SystemExit('cache version missing')
          v=int(m.group(1))+1
          sw=sw[:m.start()]+f"const CACHE_NAME = 'premium-static-v{v}';"+sw[m.end():]
          swp.write_text(sw,encoding='utf-8')

          print('FILES_CHANGED=',len(changed))
          for x in changed: print('CHANGED',x)
          print('CACHE_VERSION=',v)
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-premium-broken-refs.yml
          git add 'premium web' service-worker.js
          git commit -m 'Fix Premium internal asset and navigation references'
          git push origin HEAD:main
