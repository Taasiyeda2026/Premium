name: Implement questionnaire v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-questionnaire-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch questionnaire and instructor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Student UI: remove open questions and use the adaptive v3 engine.
          p = Path('premium web/team-questionnaire/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('שאלה 1 מתוך 17', 'שאלה 1', 1)
          s = s.replace('⚡ 17 שאלות קצרות', '⚡ 12–14 שאלות קצרות', 1)
          s = re.sub(r'\n    <section class="screen" id="funScreen">.*?</section>\n', '\n', s, count=1, flags=re.S)
          old_actions = '''        <div class="question-actions">
          <button class="primary-btn" id="nextBtn" disabled>המשך</button>
          <button class="secondary-btn" id="backBtn" type="button">חזרה</button>
        </div>'''
          new_actions = old_actions + '''
        <div class="submit-status" id="submitStatus" role="status" aria-live="polite"></div>'''
          assert old_actions in s
          s = s.replace(old_actions, new_actions, 1)
          s, n = re.subn(r'  <script>\n    \(\(\) => \{.*?  </script>', '  <script src="v3-engine.js"></script>', s, count=1, flags=re.S)
          assert n == 1
          assert 'funScreen' not in s
          assert '12–14 שאלות קצרות' in s
          p.write_text(s, encoding='utf-8')

          # Instructor: v3 profiles with legacy v2 compatibility.
          p = Path('premium web/team-questionnaire/instructor.html')
          s = p.read_text(encoding='utf-8')
          assert 'const ALGORITHM_VERSION = 2;' in s
          s = s.replace('const ALGORITHM_VERSION = 2;', 'const ALGORITHM_VERSION = 3;', 1)
          s = s.replace('const CLOSE_FIT_GAP = 5;', 'const CLOSE_FIT_GAP = 8;', 1)

          normalize_block = '''      function legacyNormalizeScores(value) {
        const source = value && typeof value === 'object' ? value : {};
        const result = {};
        ['S', 'R', 'P', 'C'].forEach(role => {
          const raw = Number(source[role]) || 0;
          const profile = SCORE_NORMALIZATION[role];
          const z = (raw - profile.mean) / profile.sd;
          const normalized = FIT_CENTER + FIT_SCALE * z;
          result[role] = Number(Math.max(0, Math.min(100, normalized)).toFixed(1));
        });
        return result;
      }

      function responseFit(student) {
        const source = student?.scores && typeof student.scores === 'object' ? student.scores : {};
        if (Number(student?.questionnaireVersion) >= 3) {
          const result = {};
          ['S', 'R', 'P', 'C'].forEach(role => { result[role] = Math.max(0, Math.min(100, Number(source[role]) || 0)); });
          const total = Object.values(result).reduce((sum, value) => sum + value, 0);
          if (total > 0 && Math.abs(total - 100) > 0.3) {
            Object.keys(result).forEach(role => { result[role] = Number((result[role] / total * 100).toFixed(1)); });
          }
          return result;
        }
        return legacyNormalizeScores(source);
      }

      function scoreChips'''
          s, n = re.subn(r'      function normalizeScores\(value\) \{.*?      function scoreChips', lambda m: normalize_block, s, count=1, flags=re.S)
          assert n == 1
          s = s.replace('normalizeScores(student.scores)', 'responseFit(student)')
          s = s.replace("tdName.innerHTML = `<strong>${escapeHtml(student.name || 'ללא שם')}</strong>${renderFunAnswers(student.funAnswers)}`;", "tdName.innerHTML = `<strong>${escapeHtml(student.name || 'ללא שם')}</strong>`;", 1)

          optimizer = '''      function assignmentMetrics(members) {
        const regrets = members.map(item => item.regret);
        const fits = members.map(item => item.roleScore);
        return {
          maxRegret: Math.max(...regrets),
          totalRegret: regrets.reduce((sum, value) => sum + value, 0),
          minFit: Math.min(...fits),
          totalFit: fits.reduce((sum, value) => sum + value, 0),
          teamAverage: fits.reduce((sum, value) => sum + value, 0) / fits.length
        };
      }

      function compareNumber(a, b, direction = 'asc') {
        const delta = Number(a) - Number(b);
        if (Math.abs(delta) < 1e-9) return 0;
        return direction === 'asc' ? (delta < 0 ? -1 : 1) : (delta > 0 ? -1 : 1);
      }

      function compareMetrics(a, b) {
        return compareNumber(a.maxRegret, b.maxRegret, 'asc') ||
          compareNumber(a.totalRegret, b.totalRegret, 'asc') ||
          compareNumber(a.minFit, b.minFit, 'desc') ||
          compareNumber(a.teamSpread || 0, b.teamSpread || 0, 'asc') ||
          compareNumber(a.totalFit, b.totalFit, 'desc');
      }

      function bestAssignment(group) {
        const isFour = group.length === 4;
        const rolesForTeam = isFour
          ? [{ id:'S', value:s=>s.S }, { id:'R', value:s=>s.R }, { id:'P', value:s=>s.P }, { id:'C', value:s=>s.C }]
          : [{ id:'S', value:s=>s.S }, { id:'R', value:s=>s.R }, { id:'PC', value:s=>combinedPCScore(s) }];
        const perms = isFour ? perms4 : perms3;
        let best = null;
        perms.forEach(perm => {
          const members = rolesForTeam.map((role, roleIndex) => {
            const student = group[perm[roleIndex]];
            const assignedFit = role.value(student.scores);
            const bestAvailableFit = Math.max(...rolesForTeam.map(candidate => candidate.value(student.scores)));
            return { student, role:role.id, roleScore:assignedFit, regret:Math.max(0, bestAvailableFit-assignedFit) };
          });
          const metrics = assignmentMetrics(members);
          const candidate = { members, metrics };
          if (!best || compareMetrics(metrics, best.metrics) < 0) best = candidate;
        });
        return best;
      }

      function partitionQuality(groups) {
        const assignments = groups.map(bestAssignment);
        const members = assignments.flatMap(item => item.members);
        const averages = assignments.map(item => item.metrics.teamAverage);
        return {
          metrics: {
            maxRegret: Math.max(...members.map(item=>item.regret)),
            totalRegret: members.reduce((sum,item)=>sum+item.regret,0),
            minFit: Math.min(...members.map(item=>item.roleScore)),
            totalFit: members.reduce((sum,item)=>sum+item.roleScore,0),
            teamSpread: Math.max(...averages)-Math.min(...averages)
          },
          assignments
        };
      }

      function cloneGroups(groups) { return groups.map(group => group.slice()); }

      function localImprove(groups) {
        let current = partitionQuality(groups);
        let changed = true;
        let passes = 0;
        while (changed && passes < 24) {
          changed = false;
          passes += 1;
          let bestSwap = null;
          let bestCandidate = current;
          for (let a=0; a<groups.length; a++) {
            for (let b=a+1; b<groups.length; b++) {
              for (let ia=0; ia<groups[a].length; ia++) {
                for (let ib=0; ib<groups[b].length; ib++) {
                  [groups[a][ia],groups[b][ib]]=[groups[b][ib],groups[a][ia]];
                  const candidate = partitionQuality(groups);
                  [groups[a][ia],groups[b][ib]]=[groups[b][ib],groups[a][ia]];
                  if (compareMetrics(candidate.metrics,bestCandidate.metrics)<0) {
                    bestCandidate = candidate;
                    bestSwap = {a,b,ia,ib};
                  }
                }
              }
            }
          }
          if (bestSwap) {
            const {a,b,ia,ib}=bestSwap;
            [groups[a][ia],groups[b][ib]]=[groups[b][ib],groups[a][ia]];
            current = partitionQuality(groups);
            changed = true;
          }
        }
        return { groups:cloneGroups(groups), ...current };
      }

      function optimizeTeams(students, sizes, seedText) {
        const baseSeed = hashString(seedText);
        let globalBest = null;
        const restarts = Math.max(8, Math.min(18, students.length));
        for (let restart=0; restart<restarts; restart++) {
          const rng = makeRng((baseSeed + Math.imul(restart+1,2654435761)) >>> 0);
          const order = shuffled(students,rng);
          const groups=[];
          let cursor=0;
          sizes.forEach(size=>{ groups.push(order.slice(cursor,cursor+size)); cursor+=size; });
          const improved = localImprove(groups);
          if (!globalBest || compareMetrics(improved.metrics,globalBest.metrics)<0) globalBest=improved;
        }
        return globalBest.assignments.map((assignment,index)=>({
          team:index+1,
          members:assignment.members.map(item=>({
            submissionId:item.student.submissionId,
            name:item.student.name,
            role:item.role,
            roleLabel:roleLabels[item.role],
            roleScore:Number(item.roleScore.toFixed(1))
          }))
        }));
      }
'''
          s, n = re.subn(r'      function bestAssignment\(group\) \{.*?      async function buildTeams\(\) \{', optimizer + '\n      async function buildTeams() {', s, count=1, flags=re.S)
          assert n == 1
          assert 'Math.exp(delta/temperature)' not in s
          assert 'const ALGORITHM_VERSION = 3;' in s
          assert 'function responseFit(student)' in s
          assert 'maxRegret' in s and 'teamSpread' in s
          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          assert 'premium-static-v44' in t
          sw.write_text(t.replace('premium-static-v44','premium-static-v45',1),encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('premium web/team-questionnaire/instructor.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          Path('/tmp/instructor.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check 'premium web/team-questionnaire/v3-engine.js'
          node --check /tmp/instructor.js

          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/index.html' 'premium web/team-questionnaire/instructor.html' service-worker.js
          git commit -m "Implement adaptive questionnaire v3"
          git push origin main