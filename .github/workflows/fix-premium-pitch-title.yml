name: Fix Premium pitch title

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix stale course title and bump cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pitch = Path('premium web/pitchpremium.html')
          if not pitch.is_file():
              raise SystemExit('premium web/pitchpremium.html is missing')

          text = pitch.read_text(encoding='utf-8')
          old = 'רוקחים עולם'
          count = text.count(old)
          if count == 0:
              raise SystemExit('Expected stale title "רוקחים עולם" was not found')
          text = text.replace(old, 'פרימיום')
          pitch.write_text(text, encoding='utf-8')
          print(f'Replaced {count} occurrence(s) in {pitch}')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          match = re.search(r"const CACHE_NAME = 'premium-static-v(\d+)';", sw_text)
          if not match:
              raise SystemExit('Could not find Premium CACHE_NAME')
          current = int(match.group(1))
          new = current + 1
          sw_text = sw_text[:match.start()] + f"const CACHE_NAME = 'premium-static-v{new}';" + sw_text[match.end():]
          sw.write_text(sw_text, encoding='utf-8')
          print(f'Cache bumped v{current} -> v{new}')

          if old in pitch.read_text(encoding='utf-8'):
              raise SystemExit('Stale title still remains')
          PY

      - name: Verify scope
        shell: bash
        run: |
          git status --short
          changed=$(git diff --name-only)
          echo "$changed"
          if echo "$changed" | grep -vE '^(premium web/pitchpremium.html|service-worker.js)$' | grep -q .; then
            echo 'ERROR: unexpected files changed'
            exit 1
          fi

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-premium-pitch-title.yml
          git add -A
          git commit -m 'Fix Premium pitch page title'
          git push origin HEAD:main
