name: Open questions one by one v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-questions-one-by-one-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch questionnaire flow
        shell: bash
        run: |
          echo '' | base64 -d | python
          git config user.name Taasiyeda2026
          git config user.email actions@users.noreply.github.com
          git add 'premium web/team-questionnaire/index.html' service-worker.js
          git commit -m 'Show open questions as part of the regular flow'
          git push