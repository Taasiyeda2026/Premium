name: Force refresh Premium news

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cache busting
        shell: bash
        run: |
          set -e
          for f in "premium web/news"/news*.html; do
            sed -i 's/מהדורת מרוול | פרימיום/מהדורת פרימיום/g' "$f"
            sed -i 's/מהדורת מארוול | פרימיום/מהדורת פרימיום/g' "$f"
            sed -Ei 's/href="news([0-9]+)\.html(\?v=[0-9]+)?"/href="news\1.html?v=17"/g' "$f"
            sed -Ei 's/href="allnews\.html(\?v=[0-9]+)?"/href="allnews.html?v=17"/g' "$f"
          done
          sed -Ei 's/href="news([0-9]+)\.html(\?v=[0-9]+)?"/href="news\1.html?v=17"/g' "premium web/news/allnews.html"
          sed -i "s/premium-static-v16/premium-static-v17/" service-worker.js

          if grep -R -n -E 'מהדורת (מרוול|מארוול) \| פרימיום' "premium web/news"; then
            echo 'Old Premium/Marvell edition wording still exists'
            exit 1
          fi
          grep -q 'news1.html?v=17' "premium web/news/allnews.html"
          grep -q "premium-static-v17" service-worker.js

      - name: Commit refresh and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/force-refresh-premium-news.yml
          git add -A
          git commit -m 'Force refresh Premium news pages after branding cleanup'
          git push origin HEAD:main
