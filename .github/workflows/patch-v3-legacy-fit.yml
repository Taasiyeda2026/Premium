name: Patch v3 legacy fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v3-legacy-fit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply compatibility patch
        run: python .github/scripts/patch_legacy_fit.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('premium web/team-questionnaire/instructor.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts
          Path('/tmp/instructor.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/instructor.js
      - name: Commit
        run: |
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/instructor.html' service-worker.js
          git commit -m "Align legacy questionnaire fits with v3 scale"
          git push origin main