name: Clean Premium article branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Premium article branding and cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          news_dir = Path('premium web/news')
          changed = 0
          for path in sorted(news_dir.glob('news*.html')):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('מהדורת מרוול | פרימיום', 'מהדורת פרימיום')
              text = text.replace('מהדורת מארוול | פרימיום', 'מהדורת פרימיום')
              text = text.replace('מרוול', 'פרימיום')
              text = text.replace('מארוול', 'פרימיום')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, count = re.subn(r"const CACHE_NAME = 'premium-static-v\d+';", "const CACHE_NAME = 'premium-static-v16';", sw, count=1)
          if count != 1:
              raise SystemExit('Could not update cache version')

          anchor = "  BASE + 'premium web/news/allnews.html',\n"
          if "BASE + 'premium web/news/news1.html'" not in sw:
              entries = ''.join("  BASE + 'premium web/news/news%d.html',\n" % i for i in range(1, 13))
              if anchor not in sw:
                  raise SystemExit('Could not find allnews cache anchor')
              sw = sw.replace(anchor, anchor + entries, 1)
          sw_path.write_text(sw, encoding='utf-8')

          leftovers = []
          for path in Path('premium web').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.html', '.css', '.js', '.json', '.md', '.txt'}:
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if 'מרוול' in text or 'מארוול' in text:
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Hebrew Marvell wording remains: ' + ', '.join(leftovers))
          if changed == 0:
              raise SystemExit('No Premium article branding matches found')
          if "premium-static-v16" not in sw_path.read_text(encoding='utf-8'):
              raise SystemExit('Cache bump missing')
          PY

      - name: Verify scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -vE '^(premium web/news/news[0-9]+\.html|service-worker\.js)$' | grep -q .; then
            echo 'Unexpected file changed'
            exit 1
          fi
          if git diff --name-only | grep -qE '^(marvell_web/|osem web/)'; then
            echo 'Marvell/Osem must remain untouched'
            exit 1
          fi

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clean-premium-news-marvell.yml
          git add -A
          git commit -m 'Remove Marvell wording from Premium articles'
          git push origin HEAD:main
