name: Apply team result details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-team-result-details.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update team result display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('premium web/team-questionnaire/instructor.html')
          text = path.read_text(encoding='utf-8')

          old = ".member { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 15px; border-bottom: 1px solid #edf2f6; }\n    .member:last-child { border-bottom: 0; }\n    .member-name { font-weight: 800; }\n    .role { font-size: 13px; font-weight: 800; color: #0b7d73; background: #eafbf7; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }"
          new = ".member { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 12px 15px; border-bottom: 1px solid #edf2f6; }\n    .member:last-child { border-bottom: 0; }\n    .member-name { font-weight: 800; }\n    .member-name::before { content: 'שם המועמד/ת'; display: block; margin-bottom: 2px; color: #7a8d9e; font-size: 10px; font-weight: 700; }\n    .role { font-size: 13px; font-weight: 800; color: #0b7d73; background: #eafbf7; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }\n    .role::before { content: 'התאמה · '; opacity: .72; font-weight: 700; }\n    .member-score { font-size: 13px; font-weight: 800; color: #36536e; background: #edf5fb; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }\n    .member-score::before { content: 'ניקוד · '; opacity: .72; font-weight: 700; }"
          assert old in text, 'member css block not found'
          text = text.replace(old, new, 1)

          old = "return globalBest.assignments.map((assignment,index)=>({ team:index+1, members:assignment.members.map(item=>({ submissionId:item.student.submissionId, name:item.student.name, role:item.role, roleLabel:roleLabels[item.role] })) }));"
          new = "return globalBest.assignments.map((assignment,index)=>({ team:index+1, members:assignment.members.map(item=>({ submissionId:item.student.submissionId, name:item.student.name, role:item.role, roleLabel:roleLabels[item.role], roleScore:Number(item.roleScore.toFixed(1)) })) }));"
          assert old in text, 'team result mapping not found'
          text = text.replace(old, new, 1)

          old = "      function renderTeams(teams) {\n        els.teamsGrid.replaceChildren(); els.copyTeamsBtn.disabled = !teams.length; els.teamCount.textContent = teams.length ? String(teams.length) : '—';\n        if (!teams.length) { els.teamsGrid.innerHTML = '<div class=\"empty\" style=\"grid-column:1/-1\">הצוותים יופיעו כאן לאחר שכל התלמידים הרלוונטיים סיימו.</div>'; return; }\n        teams.forEach(team => {\n          const card = document.createElement('article'); card.className = 'team-card'; const members = Array.isArray(team.members) ? team.members : [];\n          card.innerHTML = `<div class=\"team-title\"><span>צוות ${escapeHtml(team.team)}</span><span class=\"team-size\">${members.length} תלמידים</span></div>`;\n          members.forEach(member => { const row = document.createElement('div'); row.className = 'member'; const roleLabel = member.roleLabel || roleLabels[member.role] || member.role || ''; row.innerHTML = `<div class=\"member-name\">${escapeHtml(member.name || 'ללא שם')}</div><div class=\"role\">${escapeHtml(roleLabel)}</div>`; card.appendChild(row); });\n          els.teamsGrid.appendChild(card);\n        });\n      }"
          new = "      function memberRoleScore(member) {\n        if (Number.isFinite(Number(member?.roleScore))) return Number(member.roleScore);\n        const student = currentResponses.find(item => String(item.submissionId) === String(member?.submissionId));\n        if (!student) return null;\n        const scores = normalizeScores(student.scores);\n        if (member.role === 'PC') return Number((((scores.P + scores.C) / 2) + Math.min(scores.P, scores.C) * 0.08).toFixed(1));\n        if (['S','R','P','C'].includes(member.role)) return scores[member.role];\n        return null;\n      }\n\n      function renderTeams(teams) {\n        els.teamsGrid.replaceChildren(); els.copyTeamsBtn.disabled = !teams.length; els.teamCount.textContent = teams.length ? String(teams.length) : '—';\n        if (!teams.length) { els.teamsGrid.innerHTML = '<div class=\"empty\" style=\"grid-column:1/-1\">הצוותים יופיעו כאן לאחר שכל התלמידים הרלוונטיים סיימו.</div>'; return; }\n        teams.forEach(team => {\n          const card = document.createElement('article'); card.className = 'team-card'; const members = Array.isArray(team.members) ? team.members : [];\n          card.innerHTML = `<div class=\"team-title\"><span>צוות ${escapeHtml(team.team)}</span><span class=\"team-size\">${members.length} תלמידים</span></div>`;\n          members.forEach(member => {\n            const row = document.createElement('div'); row.className = 'member';\n            const roleLabel = member.roleLabel || roleLabels[member.role] || member.role || '';\n            const score = memberRoleScore(member);\n            row.innerHTML = `<div class=\"member-name\">${escapeHtml(member.name || 'ללא שם')}</div><div class=\"role\">${escapeHtml(roleLabel)}</div><div class=\"member-score\">${score === null ? '—' : escapeHtml(score)}</div>`;\n            card.appendChild(row);\n          });\n          els.teamsGrid.appendChild(card);\n        });\n      }"
          assert old in text, 'renderTeams block not found'
          text = text.replace(old, new, 1)

          old = "function teamsAsText() { return currentTeams.map(team => `צוות ${team.team}\\\n${team.members.map(member => `• ${member.name} — ${member.roleLabel || roleLabels[member.role] || member.role}`).join('\\\n')}`).join('\\\n\\\n'); }"
          new = "function teamsAsText() { return currentTeams.map(team => `צוות ${team.team}\\\n${team.members.map(member => { const score = memberRoleScore(member); return `• ${member.name} — התאמה: ${member.roleLabel || roleLabels[member.role] || member.role} — ניקוד: ${score === null ? '—' : score}`; }).join('\\\n')}`).join('\\\n\\\n'); }"
          assert old in text, 'teamsAsText block not found'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          assert "premium-static-v36" in sw_text, 'expected cache v36 not found'
          sw.write_text(sw_text.replace('premium-static-v36', 'premium-static-v37', 1), encoding='utf-8')
          PY

          rm .github/workflows/update-team-result-details.yml
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/instructor.html' service-worker.js .github/workflows/update-team-result-details.yml
          git commit -m "Show team candidate fit and score"
          git push origin main
