name: Audit Premium navigation and readability

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install audit dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 axe-core@4.10.3 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/premium-http.log 2>&1 &
          sleep 2

      - name: Audit all Premium HTML pages on desktop and mobile
        shell: bash
        run: |
          cat > audit-premium.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';
          import axe from 'axe-core';

          const root = path.resolve('premium web');
          const repoRoot = process.cwd();
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) files.push(full);
            }
          }
          walk(root);
          files.sort();

          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1200 } },
            { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true }
          ];

          const browser = await chromium.launch({ headless: true });
          let checksWithIssues = 0;
          let contrastNodes = 0;
          let navIssues = 0;

          function localPathFromUrl(url) {
            const u = new URL(url);
            if (u.origin !== 'http://127.0.0.1:8000') return null;
            const decoded = decodeURIComponent(u.pathname).replace(/^\//, '');
            return path.resolve(repoRoot, decoded || 'index.html');
          }

          for (const profile of profiles) {
            const context = await browser.newContext({
              viewport: profile.viewport,
              isMobile: !!profile.isMobile,
              hasTouch: !!profile.hasTouch
            });

            for (const file of files) {
              const page = await context.newPage();
              const rel = path.relative(repoRoot, file).split(path.sep).join('/');
              const url = 'http://127.0.0.1:8000/' + rel.split('/').map(encodeURIComponent).join('/');
              const issues = [];
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });

                const links = await page.locator('a[href]').evaluateAll(as => as.map(a => ({
                  href: a.href,
                  raw: a.getAttribute('href') || '',
                  text: (a.textContent || '').trim(),
                  aria: a.getAttribute('aria-label') || '',
                  title: a.getAttribute('title') || '',
                  cls: a.className || ''
                })));

                for (const link of links) {
                  if (/^(mailto:|tel:|javascript:)/i.test(link.raw) || link.raw.startsWith('#')) continue;
                  const lp = localPathFromUrl(link.href);
                  if (lp && !fs.existsSync(lp)) {
                    issues.push(`BROKEN LINK: ${link.raw} -> ${path.relative(repoRoot, lp)}`);
                    navIssues++;
                  }
                  const homeish = /עמוד הבית|דף הבית|חזרה לעמוד הבית|חזרה לדף הבית/.test(`${link.aria} ${link.title} ${link.text}`) || /home-link|home-icon/.test(String(link.cls));
                  if (homeish) {
                    const expected = path.resolve(root, 'index.html');
                    if (lp && lp !== expected) {
                      issues.push(`WRONG PREMIUM HOME: ${link.raw} -> ${path.relative(repoRoot, lp)} (expected premium web/index.html)`);
                      navIssues++;
                    }
                  }
                }

                const html = fs.readFileSync(file, 'utf8');
                for (const m of html.matchAll(/window\.location\.href\s*=\s*['\"]([^'\"]+)['\"]/g)) {
                  const raw = m[1];
                  if (/^(https?:|mailto:|tel:|#)/i.test(raw)) continue;
                  let target;
                  if (raw.startsWith('/')) target = path.resolve(repoRoot, raw.slice(1));
                  else target = path.resolve(path.dirname(file), raw.split(/[?#]/)[0]);
                  if (!fs.existsSync(target) && !fs.existsSync(target + '.html') && !fs.existsSync(path.join(target, 'index.html'))) {
                    issues.push(`BROKEN JS NAV: ${raw} -> ${path.relative(repoRoot, target)}`);
                    navIssues++;
                  }
                }

                await page.addScriptTag({ content: axe.source });
                const result = await page.evaluate(async () => {
                  const r = await axe.run(document, { runOnly: { type: 'rule', values: ['color-contrast'] } });
                  return r.violations.map(v => ({ impact: v.impact, nodes: v.nodes.map(n => ({ target: n.target.join(' '), html: n.html, summary: n.failureSummary })) }));
                });
                for (const v of result) {
                  contrastNodes += v.nodes.length;
                  for (const n of v.nodes.slice(0, 20)) issues.push(`CONTRAST ${v.impact || ''}: ${n.target} | ${n.html} | ${String(n.summary || '').replace(/\n/g, ' ')}`);
                }

                const weakOpacity = await page.evaluate(() => [...document.querySelectorAll('body *')].filter(el => {
                  const text = (el.textContent || '').trim();
                  if (!text || el.children.length > 0) return false;
                  const s = getComputedStyle(el);
                  return s.display !== 'none' && s.visibility !== 'hidden' && parseFloat(s.opacity || '1') < 0.75;
                }).slice(0, 30).map(el => ({ tag: el.tagName, cls: el.className, text: (el.textContent || '').trim().slice(0, 90), opacity: getComputedStyle(el).opacity })));
                for (const item of weakOpacity) issues.push(`LOW OPACITY TEXT: ${item.tag}.${item.cls} opacity=${item.opacity} text=${item.text}`);

                if (issues.length) {
                  checksWithIssues++;
                  console.log(`\nCHECK: ${profile.name} | ${rel}`);
                  for (const issue of issues) console.log(`  ${issue}`);
                } else {
                  console.log(`OK: ${profile.name} | ${rel}`);
                }
              } catch (e) {
                checksWithIssues++;
                console.log(`\nPAGE ERROR: ${profile.name} | ${rel}: ${e.message}`);
              } finally {
                await page.close();
              }
            }
            await context.close();
          }

          await browser.close();
          console.log(`\nAUDITED_HTML_PAGES=${files.length}`);
          console.log(`VIEWPORTS=${profiles.length}`);
          console.log(`TOTAL_PAGE_CHECKS=${files.length * profiles.length}`);
          console.log(`CHECKS_WITH_ISSUES=${checksWithIssues}`);
          console.log(`NAVIGATION_ISSUES=${navIssues}`);
          console.log(`CONTRAST_NODES=${contrastNodes}`);
          if (checksWithIssues > 0) process.exit(2);
          JS
          node audit-premium.mjs
