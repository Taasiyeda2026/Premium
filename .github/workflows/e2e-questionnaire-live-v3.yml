name: Questionnaire live E2E v3

on:
  push:
    paths:
      - '.github/workflows/e2e-questionnaire-live-v3.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full live questionnaire flow
        env:
          BASE_URL: https://taasiyeda2026.github.io/Premium/premium%20web/team-questionnaire
        run: |
          cat > e2e-questionnaire.cjs <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.BASE_URL;
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const instructor = await context.newPage();
            const className = `E2E-QUESTIONNAIRE-${Date.now()}`;
            const students = Array.from({ length: 7 }, (_, i) => [`בדיקה תלמיד ${i + 1}`, i % 4]);
            let classCode = '';

            async function fillStudent(name, offset) {
              const page = await context.newPage();
              await page.goto(`${base}/index.html?e2e=${Date.now()}-${offset}`, { waitUntil: 'networkidle' });
              await page.locator('#studentName').fill(name);
              await page.locator('#classCode').fill(classCode);
              await page.waitForFunction(() => !document.querySelector('#startBtn')?.disabled, null, { timeout: 15000 });
              await page.locator('#startBtn').click();
              await page.locator('#questionScreen.active').waitFor({ state: 'visible', timeout: 10000 });
              for (let q = 0; q < 14; q++) {
                const answers = page.locator('#answers .answer-btn');
                await answers.first().waitFor({ state: 'visible' });
                assert(await answers.count() === 4, `${name} Q${q + 1}: expected 4 answers`);
                await answers.nth((q + offset) % 4).click();
                await page.waitForFunction(() => !document.querySelector('#nextBtn')?.disabled);
                await page.locator('#nextBtn').click();
              }
              await page.locator('#funScreen.active').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#funAnswer1').fill(`בדיקת סוללה ${name}`);
              await page.locator('#funAnswer2').fill(`בדיקת צוות ${name}`);
              await page.locator('#funAnswer3').fill(`בדיקת מוצר ${name}`);
              await page.waitForFunction(() => !document.querySelector('#submitBtn')?.disabled);
              await page.locator('#submitBtn').click();
              await page.locator('#finishScreen.active').waitFor({ state: 'visible', timeout: 15000 });
              assert((await page.locator('#finishScreen').innerText()).includes('התשובות התקבלו'), `${name}: finish missing`);
              await page.close();
            }

            try {
              await instructor.goto(`${base}/instructor.html?e2e=${Date.now()}`, { waitUntil: 'networkidle' });
              await instructor.locator('#classNameInput').fill(className);
              await instructor.locator('#createClassBtn').click();
              await instructor.locator('#dashboardScreen.active').waitFor({ state: 'visible', timeout: 15000 });
              classCode = (await instructor.locator('#classCodeDisplay').innerText()).trim();
              assert(/^\d{6}$/.test(classCode), `Bad class code: ${classCode}`);
              console.log(`TEST_CLASS_CODE=${classCode}`);
              console.log(`TEST_CLASS_NAME=${className}`);

              await instructor.locator('#sessionToggleBtn').click();
              await instructor.waitForFunction(() => document.querySelector('#sessionStatusText')?.textContent?.trim() === 'השאלון פעיל', null, { timeout: 15000 });
              console.log('SESSION_START=PASS');

              for (const [name, offset] of students) {
                await fillStudent(name, offset);
                console.log(`SUBMISSION_PASS=${name}`);
              }

              const dup = await context.newPage();
              await dup.goto(`${base}/index.html?dup=${Date.now()}`, { waitUntil: 'networkidle' });
              await dup.locator('#studentName').fill(students[0][0]);
              await dup.locator('#classCode').fill(classCode);
              await dup.waitForFunction(() => document.querySelector('#classCodeStatus')?.textContent?.includes('כבר מילאתם'), null, { timeout: 15000 });
              assert(await dup.locator('#startBtn').isDisabled(), 'Duplicate start should be disabled');
              console.log('DUPLICATE_GUARD=PASS');
              await dup.close();

              await instructor.locator('#refreshBtn').click();
              await instructor.waitForFunction(() => document.querySelectorAll('#studentsWrap tbody tr').length === 7, null, { timeout: 15000 });
              assert(await instructor.locator('#studentsWrap tbody tr').count() === 7, 'Instructor should show 7 responses');
              const responseText = await instructor.locator('#studentsWrap').innerText();
              for (const [name] of students) assert(responseText.includes(name), `Instructor missing ${name}`);
              console.log('INSTRUCTOR_RESPONSES=PASS');

              await instructor.waitForFunction(() => !document.querySelector('#buildTeamsBtn')?.disabled, null, { timeout: 10000 });
              await instructor.locator('#buildTeamsBtn').click();
              await instructor.waitForFunction(() => document.querySelector('#teamStatus')?.textContent?.includes('החלוקה נשמרה'), null, { timeout: 20000 });
              const cards = instructor.locator('#teamsGrid .team-card');
              assert(await cards.count() === 2, `Expected 2 teams, got ${await cards.count()}`);
              const sizes = [await cards.nth(0).locator('.member').count(), await cards.nth(1).locator('.member').count()].sort((a,b)=>a-b);
              assert(sizes.join(',') === '3,4', `Expected 3+4, got ${sizes.join('+')}`);
              const members = instructor.locator('#teamsGrid .member');
              assert(await members.count() === 7, 'Expected 7 assigned candidates');
              for (let i = 0; i < 7; i++) {
                const row = members.nth(i);
                const name = (await row.locator('.member-name').innerText()).trim();
                const fit = (await row.locator('.role').innerText()).trim();
                const score = (await row.locator('.member-score').innerText()).trim();
                const fitPrefix = await row.locator('.role').evaluate(el => getComputedStyle(el, '::before').content);
                const scorePrefix = await row.locator('.member-score').evaluate(el => getComputedStyle(el, '::before').content);
                assert(name.length > 2, `Member ${i + 1} missing name`);
                assert(fit.length > 2 && fitPrefix.includes('התאמה'), `${name}: fit missing`);
                assert(/\d/.test(score) && scorePrefix.includes('ניקוד'), `${name}: score missing`);
              }
              console.log(`TEAM_SIZES=${sizes.join('+')}`);
              console.log('TEAM_FIELDS=PASS');

              await instructor.reload({ waitUntil: 'networkidle' });
              await instructor.locator('#dashboardScreen.active').waitFor({ state: 'visible', timeout: 15000 });
              await instructor.waitForFunction(() => document.querySelectorAll('#teamsGrid .member').length === 7, null, { timeout: 15000 });
              console.log('TEAM_PERSISTENCE=PASS');

              if ((await instructor.locator('#sessionStatusText').innerText()).trim() === 'השאלון פעיל') {
                await instructor.locator('#sessionToggleBtn').click();
                await instructor.waitForFunction(() => document.querySelector('#sessionStatusText')?.textContent?.trim() === 'השאלון לא פעיל', null, { timeout: 10000 });
              }
              console.log('SESSION_STOP=PASS');
              console.log('E2E_RESULT=PASS');
            } catch (error) {
              console.error('E2E_RESULT=FAIL');
              console.error(error.stack || error);
              try { await instructor.screenshot({ path: 'e2e-questionnaire-v3-failure.png', fullPage: true }); } catch {}
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          NODE
          node e2e-questionnaire.cjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-e2e-v3-failure
          path: e2e-questionnaire-v3-failure.png
          if-no-files-found: ignore
