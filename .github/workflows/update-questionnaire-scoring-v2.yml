name: Fix normalized questionnaire scoring

on:
  push:
    paths:
      - '.github/workflows/update-questionnaire-scoring-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix scoring implementation
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('premium web/team-questionnaire/instructor.html'); s=p.read_text(encoding='utf-8'); assert 'Numer(Math.max' in s; assert 'התאמות מודיות' in s; s=s.replace('Numer(Math.max','Number(Math.max',1).replace('התאמות מודיות','התאמות מובילות',1); p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); assert 'premium-static-v43' in s; p.write_text(s.replace('premium-static-v43','premium-static-v44',1),encoding='utf-8')"
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/instructor.html' service-worker.js
          git commit -m "Fix normalized questionnaire scoring"
          git push origin main
