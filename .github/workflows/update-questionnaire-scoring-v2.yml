name: Update questionnaire scoring v2

on:
  push:
    paths:
      - '.github/workflows/update-questionnaire-scoring-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch normalized scoring
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode('').decode())"
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/instructor.html' service-worker.js
          git commit -m "Normalize questionnaire scoring and team assignment"
          git push origin main
