name: Apply Premium image placement and class-field fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-newsletter10-image-and-poster-class.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Premium image placement and class field
        run: |
          python - <<'PY'
          from pathlib import Path

          newsletter = Path('premium web/newsletter10.html')
          text = newsletter.read_text(encoding='utf-8')
          marker = '  </style>'
          override = '''

    /* Premium card image placement refinement */
    .product-card .card-icon {
      width: min(100%, 260px);
      height: 170px;
      min-width: 0;
      border-radius: 24px;
      padding: 0;
      background: #081f3f;
      overflow: hidden;
      border: 1px solid rgba(120, 170, 220, 0.30);
      box-shadow: 0 12px 24px rgba(0, 18, 52, 0.14);
    }

    .product-card .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @media (max-width: 760px) {
      .product-card .card-icon {
        width: min(100%, 235px);
        height: 154px;
        min-width: 0;
        border-radius: 22px;
      }

      .product-card .card-icon img {
        width: 100%;
        height: 100%;
      }
    }
'''
          if 'Premium card image placement refinement' not in text:
              if marker not in text:
                  raise SystemExit('newsletter10 style marker not found')
              newsletter.write_text(text.replace(marker, override + '\n' + marker, 1), encoding='utf-8')

          poster = Path('premium web/posterpremium.html')
          ptext = poster.read_text(encoding='utf-8')
          old = 'id="poster-class" type="text" placeholder="ה׳ 1" oninput="autoWidth(this)"'
          new = 'id="poster-class" type="text" oninput="autoWidth(this)"'
          if old in ptext:
              poster.write_text(ptext.replace(old, new, 1), encoding='utf-8')
          elif new not in ptext:
              raise SystemExit('poster class field pattern not found')

          sw = Path('service-worker.js')
          swtext = sw.read_text(encoding='utf-8')
          if 'premium-static-v34' in swtext:
              sw.write_text(swtext.replace('premium-static-v34', 'premium-static-v35', 1), encoding='utf-8')
          elif 'premium-static-v35' not in swtext:
              raise SystemExit('unexpected service worker cache version')
          PY

          rm .github/workflows/fix-newsletter10-image-and-poster-class.yml

          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/newsletter10.html' 'premium web/posterpremium.html' service-worker.js .github/workflows/fix-newsletter10-image-and-poster-class.yml
          git commit -m "Fix Premium card image placement and empty class field"
          git push