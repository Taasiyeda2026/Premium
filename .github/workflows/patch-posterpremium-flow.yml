name: Patch posterpremium flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-posterpremium-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply poster patch
        run: python .github/scripts/patch_posterpremium_flow.py
      - name: Syntax and static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('premium web/posterpremium.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts, 'No script block found'
          Path('/tmp/posterpremium.js').write_text(scripts[-1], encoding='utf-8')
          assert 'שמור HTML' not in text
          assert '>מגבלות</button>' not in text
          assert 'הפקת PDF' in text
          assert 'AUTOSAVE_DB' in text
          assert 'flow-to-solution' in text
          assert text.count('bindLimits();') == 1
          PY
          node --check /tmp/posterpremium.js
          node --check service-worker.js
      - name: Commit changes
        run: |
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/posterpremium.html' service-worker.js
          git commit -m "Polish poster flow and PDF export"
          git push origin main
