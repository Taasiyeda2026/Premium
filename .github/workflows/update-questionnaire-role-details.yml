name: Update questionnaire role details

on:
  push:
    paths:
      - '.github/workflows/update-questionnaire-role-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update role details and cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('premium web/team-questionnaire/instructor.html')
          text = path.read_text(encoding='utf-8')

          old = """    .score-grid { display: grid; grid-template-columns: repeat(4, auto); gap: 5px; direction: ltr; justify-content: start; }\n    .score-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 7px; background: #edf5fb; color: #36536e; font-size: 12px; font-weight: 800; }\n    .score-chip strong { color: var(--navy); }\n"""
          new = """    .score-summary { display: grid; gap: 7px; }\n    .primary-fit { display: inline-flex; width: fit-content; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 10px; background: #eafbf7; color: #0b7d73; font-size: 12px; font-weight: 900; }\n    .score-grid { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; justify-content: flex-start; }\n    .score-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 8px; background: #edf5fb; color: #36536e; font-size: 12px; font-weight: 800; }\n    .score-chip strong { color: var(--navy); }\n    .score-chip.leading { background: #eafbf7; color: #0b7d73; box-shadow: inset 0 0 0 1px rgba(20,184,166,.18); }\n    .role-guide { margin: 0 0 14px; border: 1px solid #dce8f0; border-radius: 14px; background: #fbfdff; overflow: hidden; }\n    .role-guide summary { cursor: pointer; padding: 11px 13px; font-weight: 900; color: #31526f; }\n    .role-guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 0 13px 13px; }\n    .role-guide-item { padding: 10px 11px; border-radius: 11px; background: #fff; border: 1px solid #e4edf4; }\n    .role-guide-item strong { display: block; margin-bottom: 3px; color: var(--navy); }\n    .role-guide-item span { color: #62758a; font-size: 12px; line-height: 1.45; }\n"""
          if old not in text:
              raise SystemExit('score CSS anchor not found')
          text = text.replace(old, new, 1)

          old_mobile = """      .score-grid { margin-top: 5px; }\n      .member { grid-template-columns: 1fr; }\n"""
          new_mobile = """      .score-grid { margin-top: 5px; }\n      .role-guide-grid { grid-template-columns: 1fr; }\n      .member { grid-template-columns: 1fr; }\n"""
          if old_mobile not in text:
              raise SystemExit('mobile anchor not found')
          text = text.replace(old_mobile, new_mobile, 1)

          role_labels = """      const roleLabels = { S: 'מוביל/ת תהליך', R: 'חוקר/ת ובודק/ת', P: 'מפתח/ת מוצר', C: 'מציג/ה ומתקשר/ת', PC: 'מפתח/ת ומציג/ה' };\n"""
          role_defs = role_labels + """      const roleDescriptions = {\n        S: 'מנהל/ת את התקדמות הצוות, שומר/ת על החיבור בין הבעיה לפתרון ומתעד/ת החלטות מרכזיות.',\n        R: 'אוסף/ת מידע, בודק/ת את הצורך ופתרונות קיימים ומוודא/ת שהמסקנות מבוססות.',\n        P: 'מתרגם/ת את הרעיון למוצר, מפתח/ת קונספט ואב־טיפוס ובודק/ת היתכנות.',\n        C: 'מנסח/ת את המסר, מסביר/ה את הרעיון בצורה ברורה ומוביל/ה את הצגת המיזם.',\n        PC: 'בצוות של שלושה: משלב/ת את האחריות על פיתוח המוצר ועל הצגתו.'\n      };\n"""
          if role_labels not in text:
              raise SystemExit('role labels anchor not found')
          text = text.replace(role_labels, role_defs, 1)

          guide = """        <details class=\"role-guide\">\n          <summary>מה המשמעות של כל תפקיד?</summary>\n          <div class=\"role-guide-grid\">\n            <div class=\"role-guide-item\"><strong>מוביל/ת תהליך</strong><span>מנהל/ת את התקדמות הצוות, שומר/ת על החיבור בין הבעיה לפתרון ומתעד/ת החלטות מרכזיות.</span></div>\n            <div class=\"role-guide-item\"><strong>חוקר/ת ובודק/ת</strong><span>אוסף/ת מידע, בודק/ת את הצורך ופתרונות קיימים ומוודא/ת שהמסקנות מבוססות.</span></div>\n            <div class=\"role-guide-item\"><strong>מפתח/ת מוצר</strong><span>מתרגם/ת את הרעיון למוצר, מפתח/ת קונספט ואב־טיפוס ובודק/ת היתכנות.</span></div>\n            <div class=\"role-guide-item\"><strong>מציג/ה ומתקשר/ת</strong><span>מנסח/ת את המסר, מסביר/ה את הרעיון בצורה ברורה ומוביל/ה את הצגת המיזם.</span></div>\n            <div class=\"role-guide-item\"><strong>מפתח/ת ומציג/ה</strong><span>תפקיד משולב לצוות של שלושה: פיתוח המוצר והצגתו.</span></div>\n          </div>\n        </details>\n        <div id=\"studentsWrap\"></div>"""
          anchor = '        <div id="studentsWrap"></div>'
          if anchor not in text:
              raise SystemExit('studentsWrap anchor not found')
          text = text.replace(anchor, guide, 1)

          old_header = "table.innerHTML = '<thead><tr><th>#</th><th>תלמיד/ה</th><th>פרופיל S/R/P/C</th><th>סיום</th></tr></thead>';"
          new_header = "table.innerHTML = '<thead><tr><th>#</th><th>תלמיד/ה</th><th>התאמה לתפקידים</th><th>סיום</th></tr></thead>';"
          if old_header not in text:
              raise SystemExit('table header anchor not found')
          text = text.replace(old_header, new_header, 1)

          old_label = "tdIndex.dataset.label = 'מספר'; tdName.dataset.label = 'תלמיד/ה'; tdScores.dataset.label = 'פרופיל'; tdTime.dataset.label = 'סיום';"
          new_label = "tdIndex.dataset.label = 'מספר'; tdName.dataset.label = 'תלמיד/ה'; tdScores.dataset.label = 'התאמה לתפקידים'; tdTime.dataset.label = 'סיום';"
          if old_label not in text:
              raise SystemExit('mobile label anchor not found')
          text = text.replace(old_label, new_label, 1)

          old_fn = """      function scoreChips(scores) {\n        return `<div class=\"score-grid\"><span class=\"score-chip\"><strong>S</strong>${scores.S}</span><span class=\"score-chip\"><strong>R</strong>${scores.R}</span><span class=\"score-chip\"><strong>P</strong>${scores.P}</span><span class=\"score-chip\"><strong>C</strong>${scores.C}</span></div>`;\n      }\n"""
          new_fn = """      function scoreChips(scores) {\n        const roles = ['S', 'R', 'P', 'C'].map(role => ({ role, label: roleLabels[role], score: Number(scores[role] || 0) }));\n        const maxScore = Math.max(...roles.map(item => item.score));\n        const leaders = roles.filter(item => item.score === maxScore);\n        const leadText = leaders.map(item => item.label).join(' / ');\n        const chips = roles.map(item => `<span class=\"score-chip${item.score === maxScore ? ' leading' : ''}\" title=\"${escapeHtml(roleDescriptions[item.role] || '')}\"><span>${escapeHtml(item.label)}</span><strong>${escapeHtml(item.score)}</strong></span>`).join('');\n        return `<div class=\"score-summary\"><div class=\"primary-fit\">התאמה מובילה: ${escapeHtml(leadText)} · ${escapeHtml(maxScore)}</div><div class=\"score-grid\">${chips}</div></div>`;\n      }\n"""
          if old_fn not in text:
              raise SystemExit('scoreChips anchor not found')
          text = text.replace(old_fn, new_fn, 1)

          text = text.replace("const roleLabel = member.roleLabel || roleLabels[member.role] || member.role || '';", "const roleLabel = roleLabels[member.role] || member.roleLabel || member.role || '';", 1)
          text = text.replace("member.roleLabel || roleLabels[member.role] || member.role", "roleLabels[member.role] || member.roleLabel || member.role", 1)

          path.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "premium-static-v39" not in sw_text:
              raise SystemExit('expected cache v39 not found')
          sw.write_text(sw_text.replace('premium-static-v39', 'premium-static-v40', 1), encoding='utf-8')
          PY

          grep -q "התאמה לתפקידים" "premium web/team-questionnaire/instructor.html"
          grep -q "התאמה מובילה" "premium web/team-questionnaire/instructor.html"
          grep -q "מה המשמעות של כל תפקיד" "premium web/team-questionnaire/instructor.html"
          grep -q "premium-static-v40" service-worker.js

          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add "premium web/team-questionnaire/instructor.html" service-worker.js
          git commit -m "Clarify questionnaire roles and scores"
          git push
