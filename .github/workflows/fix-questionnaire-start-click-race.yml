name: Fix questionnaire start click race

on:
  push:
    paths:
      - '.github/workflows/fix-questionnaire-start-click-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix blur verification race and bump cache
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('premium web/team-questionnaire/index.html'); t=p.read_text(encoding='utf-8'); old=\"      els.studentName.addEventListener('blur', () => {\\n        if (els.classCode.value.length === 6 && normalizedStudentName().length >= 2) verifyClassCode(true);\\n      });\\n\\n      els.classCode.addEventListener('blur', () => {\\n        if (els.classCode.value.length && normalizedStudentName().length >= 2) verifyClassCode(true);\\n      });\\n\"; new=\"      els.studentName.addEventListener('blur', () => {\\n        const key = currentStudentKey();\\n        if (key && verifiedStudentKey !== key) verifyClassCode(true);\\n      });\\n\\n      els.classCode.addEventListener('blur', () => {\\n        const code = els.classCode.value.trim();\\n        const key = currentStudentKey();\\n        if (key && (verifiedClassCode !== code || verifiedStudentKey !== key)) verifyClassCode(true);\\n      });\\n\"; assert old in t, 'Expected blur handlers not found'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('service-worker.js'); t=p.read_text(encoding='utf-8'); assert 'premium-static-v37' in t, 'Expected cache v37 not found'; p.write_text(t.replace('premium-static-v37','premium-static-v38',1),encoding='utf-8')"
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/index.html' service-worker.js
          git commit -m "Fix questionnaire start click race"
          git push origin main
