name: Apply empty poster class field fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-poster-empty-class.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove poster class placeholder and browser autofill
        run: |
          python - <<'PY'
          from pathlib import Path

          poster = Path('premium web/posterpremium.html')
          text = poster.read_text(encoding='utf-8')
          old = '<input id="poster-class" type="text" placeholder="ה׳ 1" oninput="autoWidth(this)">'
          new = '<input id="poster-class" type="text" autocomplete="off" value="" oninput="autoWidth(this)">'
          if old not in text:
              raise SystemExit('Expected poster class field not found')
          text = text.replace(old, new, 1)
          poster.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "premium-static-v34" not in sw_text:
              raise SystemExit('Expected cache v34 not found')
          sw.write_text(sw_text.replace('premium-static-v34', 'premium-static-v35', 1), encoding='utf-8')
          PY

          rm .github/workflows/fix-poster-empty-class.yml

          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/posterpremium.html' service-worker.js .github/workflows/fix-poster-empty-class.yml
          git commit -m "Start poster class field empty"
          git push
