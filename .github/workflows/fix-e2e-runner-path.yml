name: Fix questionnaire E2E runner path

on:
  push:
    paths:
      - '.github/workflows/fix-e2e-runner-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch E2E script path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/e2e-questionnaire-live.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace("cat > /tmp/e2e-questionnaire.mjs <<'NODE'", "cat > e2e-questionnaire.mjs <<'NODE'")
          text = text.replace('node /tmp/e2e-questionnaire.mjs', 'node e2e-questionnaire.mjs')
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-e2e-runner-path.yml
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/e2e-questionnaire-live.yml .github/workflows/fix-e2e-runner-path.yml
          git commit -m "Fix questionnaire E2E module resolution"
          git push origin main
