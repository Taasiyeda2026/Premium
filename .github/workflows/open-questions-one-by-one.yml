name: Open questions one by one
on:
  push:
    branches: [main]
    paths: ['.github/workflows/open-questions-one-by-one.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('premium web/team-questionnaire/index.html')
          s=p.read_text(encoding='utf-8')
          new_section='''    <section class="screen" id="funScreen">
      <div class="card question-card">
        <div class="question-kicker" id="funQuestionKicker">שאלה 15</div>
        <h2 class="question-title" id="funQuestionTitle"></h2>
        <textarea id="funAnswer" maxlength="400" placeholder="כתבו את התשובה שלכם..."></textarea>
        <div class="question-actions">
          <button class="primary-btn" id="submitBtn" disabled>המשך</button>
          <button class="secondary-btn" id="funBackBtn" type="button">חזרה</button>
        </div>
        <div class="submit-status" id="submitStatus" role="status" aria-live="polite"></div>
      </div>
    </section>'''
          s,n=re.subn(r'    <section class="screen" id="funScreen">.*?    </section>',new_section,s,count=1,flags=re.S)
          assert n==1
          anchor="      const dimensions = ['S', 'R', 'P', 'C'];\n"
          add="""      const openQuestions = [
        { title: 'אם לצוות שלכם נשארו רק 5% סוללה בטלפון באמצע משימה - מה אתם עושים קודם?', placeholder: 'מה הייתם עושים?' },
        { title: 'איזה משפט הכי סביר שישמעו מכם באמצע עבודה קבוצתית?', placeholder: 'המשפט שלכם...' },
        { title: 'אם הייתם יכולים להמציא מוצר אחד שמעלים דבר מעצבן מהיום-יום - מה הוא היה?', placeholder: 'ההמצאה שלכם...' }
      ];
"""
          assert anchor in s
          s=s.replace(anchor,anchor+add,1)
          old="        funAnswers: [document.getElementById('funAnswer1'), document.getElementById('funAnswer2'), document.getElementById('funAnswer3')],"
          new="""        funQuestionKicker: document.getElementById('funQuestionKicker'),
        funQuestionTitle: document.getElementById('funQuestionTitle'),
        funAnswer: document.getElementById('funAnswer'),"""
          assert old in s; s=s.replace(old,new,1)
          old="          funAnswers: ['', '', ''],\n          submissionId: makeId()"
          new="          funAnswers: ['', '', ''],\n          funCurrent: 0,\n          submissionId: makeId()"
          assert old in s; s=s.replace(old,new,1)
          old="          if (!Array.isArray(parsed.funAnswers) || parsed.funAnswers.length !== 3) parsed.funAnswers = ['', '', ''];\n          if (!parsed.submissionId) parsed.submissionId = makeId();"
          new="          if (!Array.isArray(parsed.funAnswers) || parsed.funAnswers.length !== 3) parsed.funAnswers = ['', '', ''];\n          if (!Number.isInteger(parsed.funCurrent) || parsed.funCurrent < 0 || parsed.funCurrent >= openQuestions.length) parsed.funCurrent = 0;\n          if (!parsed.submissionId) parsed.submissionId = makeId();"
          assert old in s; s=s.replace(old,new,1)
          new_funcs='''      function renderFunStage() {
        const index = Math.min(Math.max(state.funCurrent || 0, 0), openQuestions.length - 1);
        state.funCurrent = index;
        const number = questions.length + index + 1;
        const total = questions.length + openQuestions.length;
        const item = openQuestions[index];
        els.funQuestionKicker.textContent = `שאלה ${number}`;
        els.funQuestionTitle.textContent = item.title;
        els.funAnswer.placeholder = item.placeholder;
        els.funAnswer.value = state.funAnswers[index] || '';
        els.submitBtn.textContent = index === openQuestions.length - 1 ? 'שליחה' : 'המשך';
        els.progressLabel.textContent = `שאלה ${number} מתוך ${total}`;
        els.progressBar.style.width = `${(number / total) * 100}%`;
        els.progressWrap.style.display = window.innerWidth >= 680 ? 'block' : 'none';
        validateFunStage();
      }

      function validateFunStage() {
        state.funAnswers[state.funCurrent] = els.funAnswer.value.trim();
        els.submitBtn.disabled = state.funAnswers[state.funCurrent].length === 0;
        saveDraft();
      }'''
          s,n=re.subn(r'      function renderFunStage\(\) \{.*?      function calculateScores\(\) \{',new_funcs+'\n\n      function calculateScores() {',s,count=1,flags=re.S)
          assert n==1
          old="        state.funAnswers = els.funAnswers.map(input => input.value.trim());\n        saveDraft();"
          new="        state.funAnswers[state.funCurrent] = els.funAnswer.value.trim();\n        saveDraft();"
          assert old in s; s=s.replace(old,new,1)
          old="          switchScreen(els.funScreen);\n          renderFunStage();"
          new="          state.funCurrent = 0;\n          switchScreen(els.funScreen);\n          renderFunStage();"
          assert old in s; s=s.replace(old,new,1)
          old="""      els.funAnswers.forEach(input => input.addEventListener('input', validateFunStage));

      els.funBackBtn.addEventListener('click', () => {
        state.current = questions.length - 1;
        saveDraft();
        switchScreen(els.questionScreen);
        renderQuestion();
      });

      els.submitBtn.addEventListener('click', submitQuiz);"""
          new="""      els.funAnswer.addEventListener('input', validateFunStage);

      els.funBackBtn.addEventListener('click', () => {
        state.funAnswers[state.funCurrent] = els.funAnswer.value.trim();
        if (state.funCurrent > 0) {
          state.funCurrent -= 1;
          saveDraft();
          renderFunStage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        state.current = questions.length - 1;
        saveDraft();
        switchScreen(els.questionScreen);
        renderQuestion();
      });

      els.submitBtn.addEventListener('click', () => {
        if (els.submitBtn.disabled) return;
        state.funAnswers[state.funCurrent] = els.funAnswer.value.trim();
        if (state.funCurrent < openQuestions.length - 1) {
          state.funCurrent += 1;
          saveDraft();
          renderFunStage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        submitQuiz();
      });"""
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js'); sw=p.read_text(encoding='utf-8')
          assert 'premium-static-v41' in sw
          p.write_text(sw.replace('premium-static-v41','premium-static-v42',1),encoding='utf-8')
          PY
          git config user.name Taasiyeda2026
          git config user.email actions@users.noreply.github.com
          git add 'premium web/team-questionnaire/index.html' service-worker.js
          git commit -m 'Show open questions as part of the regular flow'
          git push