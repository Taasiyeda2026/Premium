name: Apply Premium UI to all tabs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link shared Premium theme and update cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root_pages = [
              'premium web/newsletter4.html',
              'premium web/newsletter5.html',
              'premium web/newsletter6.html',
              'premium web/newsletter7.html',
              'premium web/newsletter8.html',
              'premium web/newsletter9.html',
              'premium web/newsletter10.html',
              'premium web/newsletter11.html',
          ]
          news_page = 'premium web/news/allnews.html'

          for file_name in root_pages:
              p = Path(file_name)
              text = p.read_text(encoding='utf-8')
              marker = '<link rel="stylesheet" href="premium-ui-2026.css" />'
              if marker not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head> in {file_name}')
                  text = text.replace('</head>', f'  {marker}\n</head>', 1)
                  p.write_text(text, encoding='utf-8')

          p = Path(news_page)
          text = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="../premium-ui-2026.css" />'
          if marker not in text:
              if '</head>' not in text:
                  raise SystemExit(f'Missing </head> in {news_page}')
              text = text.replace('</head>', f'  {marker}\n</head>', 1)
              p.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, count = re.subn(r"const CACHE_NAME = 'premium-static-v\d+';", "const CACHE_NAME = 'premium-static-v14';", sw_text, count=1)
          if count != 1:
              raise SystemExit('Could not update cache version')

          assets = [
              "  BASE + 'premium web/premium-ui-2026.css',",
              "  BASE + 'premium web/news/allnews.html',",
              "  BASE + 'premium web/newsletter4.html',",
              "  BASE + 'premium web/newsletter5.html',",
              "  BASE + 'premium web/newsletter6.html',",
              "  BASE + 'premium web/newsletter7.html',",
              "  BASE + 'premium web/newsletter8.html',",
              "  BASE + 'premium web/newsletter9.html',",
              "  BASE + 'premium web/newsletter10.html',",
              "  BASE + 'premium web/newsletter11.html',",
          ]
          anchor = "  BASE + 'premium web/images/web.png',"
          missing = [a for a in assets if a not in sw_text]
          if missing:
              if anchor not in sw_text:
                  raise SystemExit('Could not find Premium cache anchor')
              sw_text = sw_text.replace(anchor, anchor + '\n' + '\n'.join(missing), 1)
          sw.write_text(sw_text, encoding='utf-8')

          for file_name in root_pages:
              if 'premium-ui-2026.css' not in Path(file_name).read_text(encoding='utf-8'):
                  raise SystemExit(f'Theme not linked: {file_name}')
          if '../premium-ui-2026.css' not in Path(news_page).read_text(encoding='utf-8'):
              raise SystemExit('Theme not linked: news page')
          if "premium-static-v14" not in sw.read_text(encoding='utf-8'):
              raise SystemExit('Cache bump missing')
          PY

      - name: Verify scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -vE '^(premium web/news/allnews.html|premium web/newsletter(4|5|6|7|8|9|10|11)\.html|service-worker\.js)$' | grep -q .; then
            echo 'Unexpected file changed'
            exit 1
          fi
          if echo "$changed" | grep -q '^marvell_web/'; then
            echo 'marvell_web must remain untouched'
            exit 1
          fi
          if echo "$changed" | grep -q '^osem web/'; then
            echo 'osem web must remain untouched'
            exit 1
          fi

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-premium-ui-all-tabs.yml
          git add -A
          git commit -m 'Apply Premium visual language across all main tabs'
          git push origin HEAD:main
