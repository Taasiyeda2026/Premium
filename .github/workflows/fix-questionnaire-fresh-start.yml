name: Apply questionnaire fresh-start fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-questionnaire-fresh-start.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update questionnaire startup behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          q = Path('premium web/team-questionnaire/index.html')
          text = q.read_text(encoding='utf-8')

          replacements = [
              (
                  '<input id="studentName" type="text" autocomplete="name" maxlength="60" placeholder="שם פרטי ומשפחה" aria-label="שם פרטי ומשפחה" />',
                  '<input id="studentName" type="text" autocomplete="off" data-form-type="other" maxlength="60" placeholder="שם פרטי ומשפחה" aria-label="שם פרטי ומשפחה" />'
              ),
              (
                  '<input id="classCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="קוד כיתה" aria-label="קוד כיתה" />',
                  '<input id="classCode" type="text" inputmode="numeric" autocomplete="off" data-form-type="other" maxlength="6" placeholder="קוד כיתה" aria-label="קוד כיתה" />'
              ),
              (
                  "      let state = loadDraft() || createInitialState();\n",
                  "      localStorage.removeItem(STORAGE_KEY);\n      localStorage.removeItem(LEGACY_STORAGE_KEY);\n      let state = createInitialState();\n"
              ),
              (
                  "      els.studentName.value = state.name || '';\n      els.classCode.value = state.classCode || '';\n",
                  "      els.studentName.value = '';\n      els.classCode.value = '';\n      els.classCodeStatus.textContent = '';\n"
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected questionnaire pattern not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          q.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "premium-static-v33" not in sw_text:
              raise SystemExit('Expected service worker cache v33 not found')
          sw.write_text(sw_text.replace('premium-static-v33', 'premium-static-v34', 1), encoding='utf-8')
          PY

          rm .github/workflows/fix-questionnaire-fresh-start.yml

          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/index.html' service-worker.js .github/workflows/fix-questionnaire-fresh-start.yml
          git commit -m "Start questionnaire with empty student fields"
          git push
