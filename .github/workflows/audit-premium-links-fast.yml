name: Fast Premium link audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Premium local navigation and assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import os, re

          repo = Path('.').resolve()
          premium = (repo / 'premium web').resolve()
          pages = sorted(premium.rglob('*.html'))
          problems = []
          warnings = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('href','src','action','formaction'):
                      if key in d and d[key]: self.refs.append((tag,key,d[key]))

          def resolve(base, raw):
              raw = raw.strip()
              if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              u=urlparse(raw)
              if u.scheme or u.netloc: return None
              clean=unquote(u.path)
              if not clean: return None
              if clean.startswith('/'):
                  return (repo / clean.lstrip('/')).resolve()
              return (base.parent / clean).resolve()

          for p in pages:
              rel=p.relative_to(repo).as_posix()
              text=p.read_text(encoding='utf-8')
              parser=Parser(); parser.feed(text)
              for tag,key,raw in parser.refs:
                  target=resolve(p,raw)
                  if target is None: continue
                  # Directory URLs resolve to index.html for website navigation.
                  exists=target.exists() or (target.is_dir() and (target/'index.html').exists())
                  if not exists:
                      problems.append((rel,f'{tag}[{key}]',raw,target.relative_to(repo).as_posix() if str(target).startswith(str(repo)) else str(target)))

              for m in re.finditer(r"window\.location(?:\.href)?\s*=\s*['\"]([^'\"]+)['\"]", text):
                  raw=m.group(1); target=resolve(p,raw)
                  if target is not None and not (target.exists() or (target.is_dir() and (target/'index.html').exists())):
                      problems.append((rel,'window.location',raw,target.relative_to(repo).as_posix() if str(target).startswith(str(repo)) else str(target)))

              # Flag Premium content navigation escaping the Premium subtree. Root-shared static assets are allowed.
              for tag,key,raw in parser.refs:
                  if key not in ('href','action','formaction'): continue
                  target=resolve(p,raw)
                  if target is None: continue
                  try:
                      target.relative_to(premium)
                  except ValueError:
                      allowed = any(str(target).startswith(str((repo/x).resolve())) for x in ['images','icons','styles']) or target in [(repo/'manifest.json').resolve(),(repo/'pwa-register.js').resolve(),(repo/'service-worker.js').resolve()]
                      if not allowed:
                          warnings.append((rel,f'{tag}[{key}]',raw,target.relative_to(repo).as_posix() if str(target).startswith(str(repo)) else str(target)))

          print(f'PAGES={len(pages)}')
          print(f'BROKEN={len(problems)}')
          for row in problems: print('BROKEN | '+' | '.join(row))
          print(f'ESCAPING_PREMIUM={len(warnings)}')
          for row in warnings: print('ESCAPE | '+' | '.join(row))
          if problems: raise SystemExit(2)
          PY
