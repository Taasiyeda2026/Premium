name: Fix Premium newsletter4 readability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply readability fix
        shell: bash
        run: |
          cat >> "premium web/premium-ui-2026.css" <<'CSS'

          /* Premium newsletter 4: readable light cards */
          .newsletter .explanation-card,
          .newsletter .remember-box {
            background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(241,248,251,0.98) 100%) !important;
            border-color: rgba(15,76,92,0.14) !important;
            box-shadow: 0 14px 30px rgba(16,42,67,0.10) !important;
          }

          .newsletter .explanation-card h2,
          .newsletter .remember-box h3 {
            color: #102a43 !important;
            text-shadow: none !important;
          }

          .newsletter .explanation-card p,
          .newsletter .remember-box p,
          .newsletter .remember-list,
          .newsletter .remember-list li {
            color: #40586e !important;
            opacity: 1 !important;
          }

          .newsletter .card-label {
            color: #ffffff !important;
            background: linear-gradient(90deg, #0f4c5c 0%, #14b8a6 58%, #38bdf8 100%) !important;
            border-color: rgba(56,189,248,0.28) !important;
          }

          .newsletter .remember-list li::marker {
            color: #14b8a6 !important;
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          old = "const CACHE_NAME = 'premium-static-v18';"
          new = "const CACHE_NAME = 'premium-static-v19';"
          if old not in s:
              raise SystemExit('Expected cache v18 was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-newsletter4-readability.yml
          git add "premium web/premium-ui-2026.css" service-worker.js
          git commit -m 'Improve Premium newsletter text readability'
          git push origin HEAD:main
