name: Apply single questionnaire submission guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-questionnaire-single-submission.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply questionnaire patch
        run: python .github/scripts/patch-questionnaire-single-submission.py
      - name: Commit changes
        run: |
          rm .github/workflows/fix-questionnaire-single-submission.yml
          rm .github/scripts/patch-questionnaire-single-submission.py
          git config user.name "Taasiyeda2026"
          git config user.email "actions@users.noreply.github.com"
          git add 'premium web/team-questionnaire/index.html' service-worker.js .github/workflows/fix-questionnaire-single-submission.yml .github/scripts/patch-questionnaire-single-submission.py
          git commit -m "Prevent duplicate questionnaire submissions"
          git push
