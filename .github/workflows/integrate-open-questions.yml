name: Integrate open questions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-open-questions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('premium web/team-questionnaire/index.html')
          s=p.read_text(encoding='utf-8')
          changes={
            'שאלה 1 מתוך 14':'שאלה 1 מתוך 17',
            '⚡ 14 מצבים קצרים':'⚡ 17 שאלות קצרות',
            '<div class="card fun-card">':'<div class="card question-card">',
            '<div class="eyebrow">😄 שלב אחרון</div>\n        <h2>שלוש שאלות לסיום</h2>\n        <p class="fun-intro">כאן אין ניקוד ואין תשובה נכונה. פשוט כותבים את הדבר הראשון שעולה לכם לראש.</p>':'<div class="question-kicker">שאלות 15–17</div>',
            '<div class="fun-label">1. אם לצוות שלכם נשארו רק 5% סוללה בטלפון באמצע משימה - מה אתם עושים קודם?</div>':'<div class="fun-label">15. אם לצוות שלכם נשארו רק 5% סוללה בטלפון באמצע משימה - מה אתם עושים קודם?</div>',
            '<div class="fun-label">2. איזה משפט הכי סביר שישמעו מכם באמצע עבודה קבוצתית?</div>':'<div class="fun-label">16. איזה משפט הכי סביר שישמעו מכם באמצע עבודה קבוצתית?</div>',
            '<div class="fun-label">3. אם הייתם יכולים להמציא מוצר אחד שמעלים דבר מעצבן מהיום-יום - מה הוא היה?</div>':'<div class="fun-label">17. אם הייתם יכולים להמציא מוצר אחד שמעלים דבר מעצבן מהיום-יום - מה הוא היה?</div>',
            "els.nextBtn.textContent = qIndex === questions.length - 1 ? 'לשלב האחרון' : 'המשך';":"els.nextBtn.textContent = 'המשך';",
            "els.progressLabel.textContent = `שאלה ${qIndex + 1} מתוך ${questions.length}`;":"els.progressLabel.textContent = `שאלה ${qIndex + 1} מתוך ${questions.length + 3}`;",
            "els.progressBar.style.width = `${((qIndex + 1) / questions.length) * 100}%`;":"els.progressBar.style.width = `${((qIndex + 1) / (questions.length + 3)) * 100}%`;",
            "els.progressLabel.textContent = 'שלב אחרון · 3 שאלות לסיום';":"els.progressLabel.textContent = 'שאלות 15–17 מתוך 17';"
          }
          for old,new in changes.items():
            if old not in s: raise SystemExit('missing: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('premium web/team-questionnaire/instructor.html')
          s=p.read_text(encoding='utf-8')
          old='<summary>3 שאלות הסיום</summary>'
          if old not in s: raise SystemExit('missing instructor summary')
          p.write_text(s.replace(old,'<summary>שאלות פתוחות</summary>',1),encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          if 'premium-static-v40' not in s: raise SystemExit('missing cache v40')
          p.write_text(s.replace('premium-static-v40','premium-static-v41',1),encoding='utf-8')
          PY
          git config user.name Taasiyeda2026
          git config user.email actions@users.noreply.github.com
          git add 'premium web/team-questionnaire/index.html' 'premium web/team-questionnaire/instructor.html' service-worker.js
          git commit -m 'Integrate open questions into questionnaire flow'
          git push